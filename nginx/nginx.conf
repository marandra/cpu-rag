events {
    worker_connections 256;
}

http {
    # Resolve container names from the compose network at runtime
    resolver 127.0.0.11 valid=10s;

    upstream rag_pool {
        # least_conn: pick the replica with the fewest active connections.
        # Each replica serializes generation via gen_lock, so we want a new
        # request to prefer an idle replica instead of queueing behind a busy one.
        least_conn;
        server rag-1:8000 max_fails=3 fail_timeout=30s;
        server rag-2:8000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;

        # Health endpoint of the LB itself (does not touch backends)
        location = /lb-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://rag_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE: disable buffering/caching so tokens stream as produced.
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            chunked_transfer_encoding on;

            # Generation can take >>60s on CPU; align with settings.generation_timeout.
            proxy_read_timeout 1200s;
            proxy_send_timeout 1200s;
        }
    }
}
