[project]
name = "cpu-rag"
version = "2.2.0"
description = "Medical FAQ RAG with FastAPI service and CPU-only inference (fulldoc + KV cache reuse)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LLM
    # Pinned for build reproducibility, not because older is safer. The 0.3.19
    # pin came from one observation on 0.3.23, whose ggml did not emit
    # vpdpbusd/tdpbssd under GGML_NATIVE=OFF. Re-tested 2026-07-22 on the same
    # node and toolchain, only the version differing: 0.3.34 (ggml 0.16.0) emits
    # the same 1757 vpdpbusd / 94 tdpbssd / 96 tileloadd, decodes the same
    # (16.69 vs 16.62 tok/s at nT=8) and prefills 33% faster. It also adds the
    # gemma4 and granite-4.x architectures. Re-verify by objdump before moving
    # again -- over EVERY .so in llama_cpp/lib, not just libggml-cpu.so.
    "llama-cpp-python==0.3.34",
    # API service
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "src*"]
