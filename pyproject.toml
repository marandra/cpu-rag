[project]
name = "cpu-rag"
version = "1.0.0"
description = "Medical FAQ RAG with FastAPI service and CPU-only inference (fulldoc + KV cache reuse)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LLM
    # Pinned: 0.3.19's ggml honors -DGGML_AVX512_VNNI / -DGGML_AMX_INT8 and emits
    # vpdpbusd/tdpbssd; 0.3.23's ggml reworked CPU flag handling and drops them
    # under GGML_NATIVE=OFF. This is the version the HPC sweep validated.
    "llama-cpp-python==0.3.19",
    # API service
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "src*"]
